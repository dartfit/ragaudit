[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dartfit-ragaudit"
version = "0.1.0"
description = "沿检索、拼接、生成三段分别体检，定位答案错在哪个环节。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dartfit" }]
keywords = ["rag", "audit", "retrieval", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dartfit.github.io"
Repository = "https://github.com/dartfit/ragaudit"
Issues = "https://github.com/dartfit/ragaudit/issues"

[project.scripts]
ragaudit = "ragaudit:main"

[tool.setuptools]
py-modules = ["ragaudit"]
